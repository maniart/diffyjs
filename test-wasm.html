<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diffy.js v2.0 - WASM Performance Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .demo-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .canvas-container {
            text-align: center;
        }
        .stats {
            background: #333;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
        }
        .controls {
            background: #333;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .control-group {
            margin-bottom: 10px;
        }
        label {
            display: inline-block;
            width: 120px;
        }
        input[type="range"] {
            width: 200px;
        }
        .version-badge {
            background: #4CAF50;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        #motion-visualization {
            background: #000;
            border: 2px solid #444;
            margin: 10px auto;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Diffy.js <span class="version-badge">v2.0.0 WASM</span></h1>
            <p>High-performance motion detection powered by optimized JavaScript</p>
        </div>

        <div class="stats">
            <h3>Performance Metrics</h3>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="fps">0</div>
                    <div>FPS</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="avg-motion">0</div>
                    <div>Avg Motion</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="peak-motion">0</div>
                    <div>Peak Motion</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="frame-time">0</div>
                    <div>Frame Time (ms)</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <h3>Configuration</h3>
            <div class="control-group">
                <label>Sensitivity:</label>
                <input type="range" id="sensitivity" min="0" max="1" step="0.1" value="0.2">
                <span id="sensitivity-value">0.2</span>
            </div>
            <div class="control-group">
                <label>Threshold:</label>
                <input type="range" id="threshold" min="0" max="100" step="5" value="25">
                <span id="threshold-value">25</span>
            </div>
            <div class="control-group">
                <label>Debug View:</label>
                <input type="checkbox" id="debug" checked>
            </div>
        </div>

        <div class="demo-area">
            <div class="canvas-container">
                <h3>Motion Visualization</h3>
                <canvas id="motion-visualization" width="300" height="200"></canvas>
            </div>
            <div class="canvas-container">
                <h3>Motion Data</h3>
                <pre id="motion-data" style="background: #000; padding: 10px; border-radius: 4px; font-size: 10px; height: 200px; overflow-y: auto;"></pre>
            </div>
        </div>
    </div>

    <script src="dist/diffy-wasm.min.js"></script>
    <script>
        let diffy;
        let stats = {
            frameCount: 0,
            lastTime: performance.now(),
            motionHistory: [],
            frameTimeHistory: []
        };

        // Performance monitoring
        function updateStats(matrix) {
            const now = performance.now();
            const frameTime = now - stats.lastTime;
            stats.lastTime = now;
            stats.frameCount++;
            
            // Calculate motion metrics
            const flatMatrix = matrix.flat();
            const avgMotion = flatMatrix.reduce((a, b) => a + b, 0) / flatMatrix.length;
            const peakMotion = Math.max(...flatMatrix);
            
            // Update history
            stats.motionHistory.push(avgMotion);
            stats.frameTimeHistory.push(frameTime);
            if (stats.motionHistory.length > 60) {
                stats.motionHistory.shift();
                stats.frameTimeHistory.shift();
            }
            
            // Update UI every 10 frames
            if (stats.frameCount % 10 === 0) {
                const fps = Math.round(1000 / (stats.frameTimeHistory.reduce((a, b) => a + b, 0) / stats.frameTimeHistory.length));
                const avgFrameTime = Math.round(stats.frameTimeHistory.reduce((a, b) => a + b, 0) / stats.frameTimeHistory.length * 100) / 100;
                
                document.getElementById('fps').textContent = fps;
                document.getElementById('avg-motion').textContent = Math.round(avgMotion);
                document.getElementById('peak-motion').textContent = Math.round(peakMotion);
                document.getElementById('frame-time').textContent = avgFrameTime;
                
                // Update motion data
                document.getElementById('motion-data').textContent = 
                    'Matrix (' + matrix.length + 'x' + (matrix[0] ? matrix[0].length : 0) + '):\\n' +
                    matrix.map(row => row.map(val => Math.round(val).toString().padStart(3)).join(' ')).join('\\n');
            }
            
            // Visualize motion
            visualizeMotion(matrix);
        }

        // Motion visualization
        function visualizeMotion(matrix) {
            const canvas = document.getElementById('motion-visualization');
            const ctx = canvas.getContext('2d');
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (!matrix.length) return;
            
            const cellWidth = canvas.width / matrix.length;
            const cellHeight = canvas.height / matrix[0].length;
            
            for (let x = 0; x < matrix.length; x++) {
                for (let y = 0; y < matrix[x].length; y++) {
                    const intensity = Math.min(matrix[x][y] / 255, 1);
                    const color = `rgba(255, ${255 - intensity * 255}, ${255 - intensity * 255}, ${0.3 + intensity * 0.7})`;
                    
                    ctx.fillStyle = color;
                    ctx.fillRect(x * cellWidth, y * cellHeight, cellWidth, cellHeight);
                    
                    // Draw cell borders
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x * cellWidth, y * cellHeight, cellWidth, cellHeight);
                }
            }
        }

        // Initialize Diffy
        function initDiffy() {
            try {
                diffy = Diffy.create({
                    resolution: { x: 15, y: 10 },
                    sensitivity: parseFloat(document.getElementById('sensitivity').value),
                    threshold: parseInt(document.getElementById('threshold').value),
                    debug: document.getElementById('debug').checked,
                    sourceDimensions: { w: 160, h: 120 },
                    onFrame: updateStats
                });
                
                console.log('✅ Diffy.js v2.0.0 initialized successfully!');
            } catch (error) {
                console.error('❌ Failed to initialize Diffy.js:', error);
                document.getElementById('motion-data').textContent = 'Error: ' + error.message;
            }
        }

        // Control handlers
        document.getElementById('sensitivity').addEventListener('input', (e) => {
            document.getElementById('sensitivity-value').textContent = e.target.value;
        });

        document.getElementById('threshold').addEventListener('input', (e) => {
            document.getElementById('threshold-value').textContent = e.target.value;
        });

        // Initialize when page loads
        window.addEventListener('load', () => {
            console.log('🚀 Starting Diffy.js v2.0.0 performance test...');
            initDiffy();
        });
    </script>
</body>
</html>
