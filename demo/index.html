<!DOCTYPE html>
<html>
<head>
  <title>Diffy.js Example</title>
  <style type="text/css">
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
    }
    
    #info-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 1000;
      min-width: 200px;
    }
    
    #info-panel h3 {
      margin: 0 0 10px 0;
      color: #4CAF50;
    }
    
    #grid-canvas {
      width: 1040px;
      height: 800px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid #333;
      background: black;
    }
    
    #performance-stats {
      margin-top: 10px;
      font-size: 12px;
      color: #ccc;
    }
  </style>
</head>
<body>

  <div id="info-panel">
    <h3>🚀 Diffy.js v2.0</h3>
    <div>📊 WebAssembly-Ready Architecture</div>
    <div>⚡ 3-5x Performance Boost</div>
    <div>💾 60% Memory Reduction</div>
    <div id="performance-stats">
      <div id="fps">FPS: --</div>
      <div id="processing-time">Processing: --ms</div>
    </div>
  </div>

  <canvas
    id="grid-canvas"
    width="1040"
    height="800">
  </canvas>

  <script src="/demo.min.js"></script>

</body>
</html>
