[package]
name = "diffyjs-wasm"
version = "2.0.0"
edition = "2021"
description = "A high-performance motion detection library compiled to WebAssembly"
license = "MIT"
repository = "https://github.com/maniart/diffyjs"

[lib]
name = "diffyjs_wasm"
path = "rust-src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wee_alloc = { version = "0.4.5", optional = true }

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "CanvasRenderingContext2d",
  "HtmlCanvasElement",
  "ImageData",
  "HtmlVideoElement",
  "MediaDevices",
  "MediaStream",
  "MediaStreamConstraints",
  "Navigator",
  "Window",
  "Document",
  "HtmlElement",
  "Element",
]

[features]
default = ["wee_alloc"]

[profile.release]
opt-level = "s"
lto = true